{% include "_header_comment.conf" %}

{% if enabled %}

{% include "_hsts_map.conf" %}

# ============ 负载均衡 upstream 配置 ============
{% if has_upstream %}

{% if is_mixed_scheme %}
# 异构协议模式：为每个上游节点生成 Dummy 中转 Server（监听 Unix Socket）
{% for us in upstream_servers %}
server {
  listen unix:/tmp/npm_upstream_{{ id }}_{{ forloop.index0 }}.sock;

  location / {
    {% if forward_host_override %}
    # 覆写目标域名 — 自动复用该上游节点主机名
    rewrite_by_lua_block {
        ngx.req.set_header("Host", "{{ us.server }}")
    }
    proxy_ssl_server_name on;
    proxy_ssl_name {{ us.server }};
    # 使用 Lua 修改后的请求头（$http_host 会追踪 Lua 的变更，$host 不会）
    proxy_set_header Host $http_host;
    {% else %}
    proxy_set_header Host $host;
    {% endif %}
    proxy_pass {{ us.scheme }}://{{ us.server }}:{{ us.port }};
    proxy_set_header X-Forwarded-Scheme $scheme;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-For    $remote_addr;
    proxy_set_header X-Real-IP          $remote_addr;
  }
}
{% endfor %}

# Upstream 统一用 HTTP 指向本地 Socket
upstream npm_upstream_{{ id }} {
  {% if load_balance_method == "least_conn" %}least_conn;{% endif %}
  {% if load_balance_method == "ip_hash" %}ip_hash;{% endif %}

  {% for us in upstream_servers %}
  server unix:/tmp/npm_upstream_{{ id }}_{{ forloop.index0 }}.sock weight={{ us.weight }};
  {% endfor %}
}
{% else %}
# 同构协议模式：标准 upstream 块
upstream npm_upstream_{{ id }} {
  {% if load_balance_method == "least_conn" %}least_conn;{% endif %}
  {% if load_balance_method == "ip_hash" %}ip_hash;{% endif %}

  {% for us in upstream_servers %}
  server {{ us.server }}:{{ us.port }} weight={{ us.weight }};
  {% endfor %}
}
{% endif %}

{% endif %}

server {
{% if has_upstream %}
  # 负载均衡模式：使用 upstream 名称
  set $forward_scheme {{ upstream_scheme }};
  set $server         "npm_upstream_{{ id }}";
  set $port           80;
{% else %}
  # 单节点模式：原有行为
  set $forward_scheme {{ forward_scheme }};
  set $server         "{{ forward_host }}";
  set $port           {{ forward_port }};
{% endif %}

{% include "_listen.conf" %}
{% include "_certificates.conf" %}
{% include "_assets.conf" %}
{% include "_exploits.conf" %}
{% include "_hsts.conf" %}
{% include "_forced_ssl.conf" %}

{% if allow_websocket_upgrade == 1 or allow_websocket_upgrade == true %}
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;
{% endif %}

  access_log /data/logs/proxy-host-{{ id }}_access.log proxy;
  error_log /data/logs/proxy-host-{{ id }}_error.log warn;

{% if forward_host_override %}
# 覆写目标域名（OpenResty Lua 拦截 + SNI 穿透）— 自动复用转发主机名
rewrite_by_lua_block {
    ngx.req.set_header("Host", "{{ forward_host }}")
}
proxy_ssl_server_name on;
proxy_ssl_name {{ forward_host }};
{% endif %}

{{ advanced_config }}

{{ locations }}

{% if use_default_location %}

  location / {

{% include "_access.conf" %}
{% include "_hsts.conf" %}

    {% if allow_websocket_upgrade == 1 or allow_websocket_upgrade == true %}
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    {% endif %}

{% if has_upstream %}
    # 负载均衡模式：直接 proxy_pass 到 upstream
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Scheme $scheme;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-For    $remote_addr;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_pass {{ upstream_scheme }}://npm_upstream_{{ id }};
{% else %}
    # Proxy!
    include conf.d/include/proxy.conf;
{% endif %}
  }
{% endif %}

  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}
{% endif %}
