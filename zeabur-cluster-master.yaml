# yaml-language-server: $schema=https://schema.zeabur.app/template.json
# Zeabur 部署模板 - New API (主节点 + Nginx Proxy Manager)

apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: New API (Master Node)
spec:
  description: New API Master Node cluster setup. Includes PostgreSQL, Redis, and New API backend.
  icon: https://raw.githubusercontent.com/QuantumNous/new-api/main/web/public/logo.png
  tags:
    - AI
    - API
    - Tool
  
  variables:
    - key: SESSION_SECRET
      type: PASSWORD
      name: 会话密钥
      description: 用于保持用户登录状态的密钥（随意填入16位以上随机字符，必须与子节点一致）。
    - key: CRYPTO_SECRET
      type: PASSWORD
      name: 加密密钥
      description: 用于对核心加密数据进行加解密的密钥（随意填入16位以上随机字符，必须与子节点一致）。
    - key: TZ
      type: STRING
      name: 系统时区
      description: 运行时的系统时区（必须填：Asia/Shanghai）。
    - key: ERROR_LOG_ENABLED
      type: STRING
      name: 开启错误日志
      description: 是否开启错误日志记录 (填 true 或 false，通常填 true)。
    - key: BATCH_UPDATE_ENABLED
      type: STRING
      name: 开启批量更新
      description: 是否允许异步数据批量写入 (填 true 或 false，通常填 true)。
      
  services:
    # ---------------------------------------------
    # 1. PostgreSQL 数据库
    # ---------------------------------------------
    - name: PostgreSQL
      icon: https://raw.githubusercontent.com/zeabur/service-icons/main/marketplace/postgresql.svg
      template: PREBUILT
      spec:
        source:
          image: postgres:15
        ports:
          - id: database
            port: 5432
            type: TCP
        volumes:
          - id: data
            dir: /var/lib/postgresql/data
        instructions:
          - title: Connection String
            content: postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@${MASTER_DB_HOST}:5432/${POSTGRES_DB}
          - title: Database
            content: ${POSTGRES_DB}
          - title: Username
            content: ${POSTGRES_USERNAME}
          - title: Password
            content: ${POSTGRES_PASSWORD}
        env:
          POSTGRES_DB:
            default: new-api
            expose: true
          POSTGRES_USERNAME:
            default: postgres
            expose: true
          POSTGRES_USER:
            default: postgres
            expose: true
          POSTGRES_PASSWORD:
            default: ${PASSWORD}
            expose: true
          MASTER_DB_HOST:
            default: ${CONTAINER_HOSTNAME}
            expose: true

    # ---------------------------------------------
    # 2. Redis 数据库
    # ---------------------------------------------
    - name: Redis
      icon: https://raw.githubusercontent.com/zeabur/service-icons/main/marketplace/redis.svg
      template: PREBUILT
      spec:
        source:
          image: redis:7
        ports:
          - id: database
            port: 6379
            type: TCP
        volumes:
          - id: data
            dir: /data
        instructions:
          - title: Connection String
            content: redis://${CONTAINER_HOSTNAME}:6379
        env:
          REDIS_HOST:
            default: ${CONTAINER_HOSTNAME}
            expose: true
          REDIS_PORT:
            default: "6379"
            expose: true
          MASTER_REDIS_URI:
            default: redis://${CONTAINER_HOSTNAME}:6379
            expose: true

    # ---------------------------------------------
    # 3. New API 业务核心 (Master Node)
    # ---------------------------------------------
    - name: New API Master
      icon: https://raw.githubusercontent.com/QuantumNous/new-api/main/web/public/logo.png
      template: GIT
      spec:
        source:
          source: GITHUB
          repo: 1214600203
          branch: main
        ports:
          - id: http
            port: 3000
            type: HTTP
        volumes:
          - id: data
            dir: /data
          - id: logs
            dir: /app/logs
        env:
          SQL_DSN:
            default: postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@${MASTER_DB_HOST}:5432/${POSTGRES_DB}
          REDIS_CONN_STRING:
            default: ${MASTER_REDIS_URI}
          SESSION_SECRET:
            default: ${SESSION_SECRET}
          CRYPTO_SECRET:
            default: ${CRYPTO_SECRET}
          NODE_TYPE:
            default: master
          TZ:
            default: ${TZ}
          ERROR_LOG_ENABLED:
            default: ${ERROR_LOG_ENABLED}
          BATCH_UPDATE_ENABLED:
            default: ${BATCH_UPDATE_ENABLED}
          MASTER_API_HOSTNAME:
            default: ${CONTAINER_HOSTNAME}
            expose: true
            
      dependencies:
        - PostgreSQL
        - Redis


